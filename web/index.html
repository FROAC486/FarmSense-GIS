<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FarmSense GIS</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #titleBox {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      z-index: 10;
      max-width: 360px;
    }

    #titleBox h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
    }

    #titleBox p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div id="titleBox">
    <h2>FarmSense GIS</h2>
    <p>Cloud-based IoT sensor monitoring for farm environmental conditions.</p>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJkYzM5Mjg0My1mZWZlLTRmNDMtODdkOS1hZTY2YWU0ZTc0ZGYiLCJpZCI6Mzk4NTkxLCJzdWIiOiJGUk9BQzQ4NiIsImlzcyI6Imh0dHBzOi8vaW9uLmNlc2l1bS5jb20iLCJhdWQiOiIyODBTdW5ueXNpZGVSb2FkIiwiaWF0IjoxNzc4MDQ4MjY0fQ.gTOJQiU2ytmtklEAEnOVe4OQ0_VGReM6RyAfMySSiuw";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
      baseLayerPicker: true,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false
    });

    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(143.7737, -38.6956, 1200),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-55),
        roll: 0
      }
    });

    function getVal(props, name) {
      return props && props[name] ? props[name].getValue() : null;
    }

    function displayVal(value, unit = "") {
      if (value === null || value === undefined || value === "" || Number.isNaN(value)) {
        return "N/A";
      }
      return `${value}${unit}`;
    }

    function styleSensor(entity) {
      const p = entity.properties;
      const site = getVal(p, "site");

      entity.point = new Cesium.PointGraphics({
        pixelSize: 14,
        color: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
      });

      entity.label = new Cesium.LabelGraphics({
        text: site ? site.toString() : "Sensor",
        font: "14px Arial",
        pixelOffset: new Cesium.Cartesian2(0, -25),
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.6)
      });
    }

    function buildPopup(entity) {
      const p = entity.properties;

      const site = getVal(p, "site");
      const device = getVal(p, "device_name");
      const type = getVal(p, "device_profile_name");
      const time = getVal(p, "time");

      const temp = getVal(p, "temperature_c") ?? getVal(p, "air_temperature") ?? getVal(p, "tank_temp_c");
      const humidity = getVal(p, "humidity") ?? getVal(p, "air_humidity");
      const pressure = getVal(p, "pressure");
      const battery = getVal(p, "battery_v") ?? getVal(p, "tank_battery_v");

      const windSpeed = getVal(p, "wind_speed");
      const windDirection = getVal(p, "wind_direction");
      const windGust = getVal(p, "wind_gust");

      const rainGauge = getVal(p, "rain_gauge");
      const rainAccumulation = getVal(p, "rain_accumulation");

      const tankDistance = getVal(p, "tank_distance");

      const lat = getVal(p, "sensor_latitude");
      const lon = getVal(p, "sensor_longitude");

      entity.description = `
        <h3>${displayVal(site)}</h3>

        <p><b>Device:</b> ${displayVal(device)}</p>
        <p><b>Type:</b> ${displayVal(type)}</p>
        <p><b>Time:</b> ${displayVal(time)}</p>

        <hr>

        <p><b>Temperature:</b> ${displayVal(temp, " °C")}</p>
        <p><b>Humidity:</b> ${displayVal(humidity, " %")}</p>
        <p><b>Pressure:</b> ${displayVal(pressure, " hPa")}</p>
        <p><b>Battery:</b> ${displayVal(battery, " V")}</p>

        <hr>

        <p><b>Wind speed:</b> ${displayVal(windSpeed, " m/s")}</p>
        <p><b>Wind direction:</b> ${displayVal(windDirection, "°")}</p>
        <p><b>Wind gust:</b> ${displayVal(windGust, " m/s")}</p>
        <p><b>Rain gauge:</b> ${displayVal(rainGauge, " mm")}</p>
        <p><b>Rain accumulation:</b> ${displayVal(rainAccumulation, " mm")}</p>
        <p><b>Tank distance:</b> ${displayVal(tankDistance)}</p>

        <hr>

        <p><b>Latitude:</b> ${displayVal(lat)}</p>
        <p><b>Longitude:</b> ${displayVal(lon)}</p>
      `;
    }

    let sensorDataSource = null;

    function loadSensorData() {
      if (viewer.selectedEntity) {
        return;
      }

      const geojsonUrl = "sensor_latest.geojson?cache=" + Date.now();

      Cesium.GeoJsonDataSource.load(geojsonUrl, {
        clampToGround: true
      }).then(function(newDataSource) {

        if (sensorDataSource) {
          viewer.dataSources.remove(sensorDataSource);
        }

        sensorDataSource = newDataSource;
        viewer.dataSources.add(sensorDataSource);

        const entities = sensorDataSource.entities.values;

        for (let i = 0; i < entities.length; i++) {
          styleSensor(entities[i]);
          buildPopup(entities[i]);
        }

      }).catch(function(error) {
        console.error("Error loading GeoJSON:", error);
      });
    }

    loadSensorData();
    setInterval(loadSensorData, 30000);
  </script>
</body>
</html>
